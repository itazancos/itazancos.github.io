<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>謎のボタンサイト</title>
    <style>
        /* 画面中央にボタンを配置する設定 */
        body {
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1a1a1a; /* 背景をダークに */
            font-family: sans-serif;
        }

        /* 危険そうな赤いボタンの見た目 */
        #jump-button {
            padding: 20px 40px;
            font-size: 24px;
            font-weight: bold;
            background-color: #ff3838;
            color: white;
            border: 4px solid #fff;
            border-radius: 50px; /* 丸いボタン */
            cursor: pointer;
            box-shadow: 0 10px 20px rgba(255,56,56,0.4);
            transition: 0.2s;
        }

        /* マウスを乗せたときに少し大きくする */
        #jump-button:hover {
            transform: scale(1.1);
            background-color: #ff4d4d;
        }
    </style>
</head>
<body>

    <!-- ボタン本体 -->
    <button id="jump-button">絶対に押すな</button>

    <script>
        // ボタンを取得
        const button = document.getElementById('jump-button');

        // ボタンがクリックされたときの動き
        button.addEventListener('click', () => {
            alert("押したな？ 異世界へ転生させます。");
            
            // 🚨 ここに行き先のサイトのURLを書く！
            // 今は例としてGoogleになっています。好きなURLに変えてね！
            window.location.href = "https://google.com"; 
        });
    </script>

</body>
</html>
