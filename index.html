<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>押してみて♡</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #111;
            overflow: hidden; /* ボタンが画面の外に飛び出さないようにする */
            font-family: sans-serif;
            position: relative;
        }

        /* 逃げるボタンの設定 */
        #neta-button {
            position: absolute; /* 自由に動かせるようにする */
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%); /* 画面の真ん中に配置 */
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.1s ease; /* 動くときのアニメーション */
        }

        /* メッセージを表示するエリア */
        #message-box {
            position: absolute;
            top: 20%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 24px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>
<body>

    <div id="message-box">ここだよ？</div>
    <button id="neta-button">どこ刺してるんだい？</button>

    <script>
        const button = document.getElementById('neta-button');
        const messageBox = document.getElementById('message-box');
        
        let escapeCount = 0; // 逃げた回数を数えるカウンター
        const maxEscapes = 8; // 逃げる回数

        // マウスが近づいた（乗った）ときの動き
        button.addEventListener('mouseover', () => {
            if (escapeCount < maxEscapes) {
                escapeCount++;

                // 画面内のランダムな位置を計算
                const randomX = Math.random() * (window.innerWidth - button.offsetWidth);
                const randomY = Math.random() * (window.innerHeight - button.offsetHeight);

                // ボタンの位置をランダムに変えて逃がす
                button.style.left = randomX + 'px';
                button.style.top = randomY + 'px';
                button.style.transform = 'none'; // 中央寄せを解除して動かす

                // 逃げた回数に合わせて煽るメッセージ
                messageBox.innerText = `どこ行ってんのｗ (${escapeCount}回目)`;
                
                if (escapeCount === maxEscapes) {
                    // 5回逃げたらボタンの色を変えて、降参モードにする
                    button.innerText = "うわぁぁ参りました…押していいよ";
                    button.style.backgroundColor = "#2ed573";
                    button.style.boxShadow = "0 5px 15px rgba(46, 213, 115, 0.4)";
                    messageBox.innerText = "";
                }
            }
        });

        // 8回目にようやくボタンを押したときの動き
        button.addEventListener('click', () => {
            if (escapeCount >= maxEscapes) {
                // ボタンを無効化して連打を防ぐ
                button.disabled = true;
                button.innerText = "";
                
                // 5秒間のカウントダウンを開始
                let secondsLeft = 5;
                messageBox.innerText = `byeye(${secondsLeft})`;

                const countdown = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft > 0) {
                        messageBox.innerText = `byebye (${secondsLeft})`;
                    } else {
                        clearInterval(countdown);
                        messageBox.innerText = "^ ^";
                        
                        // 🚨 5秒後に飛ばしたいサイトのURLをここに書く
                        window.location.href = "https://www.youtube.com/watch?guid=ON&gl=JP&hl=ja&client=mv-google&v=dQw4w9WgXcQ&app=desktop";
                    }
                }, 1000); // 1秒（1000ミリ秒）ごとに実行
            }
        });
    </script>

</body>
</html>
