<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>押してみて♡</title>
    <style>
        body {
            margin: 0;
            height: 100vh;
            background-color: #111;
            overflow: hidden; /* ボタンが画面の外に飛び出さないようにする */
            font-family: sans-serif;
            position: relative;
            /* スマホで長押ししたときに選択されるのを防ぐ */
            -webkit-user-select: none;
            user-select: none;
        }

        /* 逃げるボタンの設定 */
        #neta-button {
            position: absolute;
            left: 50%;
            top: 50%;
            transform: translate(-50%, -50%);
            padding: 15px 30px;
            font-size: 20px;
            font-weight: bold;
            background-color: #ff4757;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(255, 71, 87, 0.4);
            transition: all 0.1s ease;
            /* スマホでのタップ時の青いハイライトを消す */
            -webkit-tap-highlight-color: transparent;
        }

        /* メッセージを表示するエリア */
        #message-box {
            position: absolute;
            top: 15%;
            left: 50%;
            transform: translateX(-50%);
            color: white;
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            width: 90%;
        }
    </style>
</head>
<body>

    <div id="message-box"></div>
    <button id="neta-button">押して</button>

    <script>
        const button = document.getElementById('neta-button');
        const messageBox = document.getElementById('message-box');
        
        let escapeCount = 0;
        const maxEscapes = 5;

        // 🚨 ボタンを逃がす共通の関数（スマホ・PC両用）
        function escapeButton(e) {
            if (escapeCount < maxEscapes) {
                // スマホのタップで、ボタンが勝手にクリックされるのを防ぐ
                e.preventDefault(); 
                
                escapeCount++;

                // 画面内のランダムな位置を計算（端っこに行きすぎないように少し余裕を持たせる）
                const randomX = Math.random() * (window.innerWidth - button.offsetWidth - 20) + 10;
                const randomY = Math.random() * (window.innerHeight - button.offsetHeight - 20) + 10;

                // ボタンの位置をランダムに変えて逃がす
                button.style.left = randomX + 'px';
                button.style.top = randomY + 'px';
                button.style.transform = 'none';

                // メッセージの更新
                messageBox.innerText = `逃げた！ (${escapeCount}回目)`;
                
                if (escapeCount === maxEscapes) {
                    button.innerText = "うわぁぁ参りました…押していいよ";
                    button.style.backgroundColor = "#2ed573";
                    button.style.boxShadow = "0 5px 15px rgba(46, 213, 115, 0.4)";
                }
            }
        }

        // 💻 パソコン用：マウスが近づいたとき
        button.addEventListener('mouseover', escapeButton);

        // 📱 スマホ用：画面に指が触れた瞬間
        button.addEventListener('touchstart', escapeButton, { passive: false });

        // 6回目にようやくボタンを押したときの動き
        button.addEventListener('click', () => {
            if (escapeCount >= maxEscapes) {
                button.disabled = true;
                button.innerText = "ロックオン完了";
                
                let secondsLeft = 5;
                messageBox.innerText = `byebye (${secondsLeft})`;

                const countdown = setInterval(() => {
                    secondsLeft--;
                    if (secondsLeft > 0) {
                        messageBox.innerText = `byebye (${secondsLeft})`;
                    } else {
                        clearInterval(countdown);
                        messageBox.innerText = "^ ^";
                        
                        // 行き先のURL（好きなURLに変えてね）
                        window.location.href = "https://www.youtube.com/watch?v=BBJa32lCaaY";
                    }
                }, 1000);
            }
        });
    </script>

</body>
</html>
